all:
  children:
    reachy_mini:
      vars:
        # Defaults für die Gruppe — pro Host unter `hosts:` überschreibbar.
        target_user: pollen
        timezone: Europe/Berlin
        # Public-Key wird zur Laufzeit aus pass(1) auf dem Control-Host gelesen.
        # Voraussetzung: `pass show private/keyfiles/ssh/private_ed25519/id_ed25519.pub`
        # liefert genau eine OpenSSH-authorized_keys-Zeile.
        ssh_authorized_key: >-
          {{ lookup('pipe', 'pass show private/keyfiles/ssh/private_ed25519/id_ed25519.pub') }}
      hosts:
        reachy-mini:
          ansible_host: reachy-mini.local
          ansible_user: pollen
          ansible_python_interpreter: /usr/bin/python3
